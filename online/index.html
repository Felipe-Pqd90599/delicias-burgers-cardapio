<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delícias Burgers — Cardápio</title>
    <meta
      name="description"
      content="Rodízio, sanduíches, pizzas e pastéis da Delícias Burgers na Zona Norte de Natal-RN."
    />
    <meta property="og:title" content="Delícias Burgers — Cardápio" />
    <meta
      property="og:description"
      content="Veja o cardápio e peça delivery pelo WhatsApp."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/capa.png" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Pacifico&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=0.8.2-delivery" />
  </head>
  <body>
    <h1 class="sr-only">Delícias Burgers — Cardápio</h1>
    <header class="hero" id="topo">
      <div class="hero__photo" aria-hidden="true"></div>
      <div class="hero__veil"></div>
      <div class="hero__content">
        <p class="hero__place" id="hero-place"></p>
        <div class="hero__actions" id="hero-actions"></div>
      </div>
    </header>

    <div id="featured-root"></div>

    <nav class="cat-nav" id="cat-nav" aria-label="Categorias"></nav>
    <main class="menu" id="menu"></main>

    <footer class="footer" id="footer"></footer>

    <div class="modal" id="modal" hidden>
      <div class="modal__backdrop" data-close></div>
      <div class="modal__sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal__close" type="button" data-close aria-label="Fechar">×</button>
        <h3 id="modal-title"></h3>
        <p class="modal__desc" id="modal-desc"></p>
        <div class="modal__portions" id="modal-portions"></div>
        <div class="modal__block" id="modal-flavors" hidden></div>
        <div class="modal__block" id="modal-toppings" hidden></div>
        <div class="modal__block" id="modal-remove" hidden></div>
        <div class="modal__block" id="modal-extras" hidden></div>
        <label class="modal__label" for="modal-comment">Observação</label>
        <textarea
          id="modal-comment"
          class="modal__comment"
          rows="2"
          maxlength="240"
          placeholder="Alergia, ponto da carne, recado para a cozinha…"
        ></textarea>
        <div class="modal__qty" id="modal-qty-box"></div>
        <p class="modal__price" id="modal-price"></p>
        <p class="modal__hint" id="modal-hint"></p>
        <div class="modal__wa" id="modal-wa"></div>
      </div>
    </div>

    <button class="cart-fab" id="cart-fab" type="button" aria-controls="cart">
      Carrinho
      <span class="cart-fab__count" id="cart-count">0</span>
    </button>

    <div class="cart" id="cart" hidden>
      <div class="modal__backdrop" data-cart-close></div>
      <div class="cart__sheet" role="dialog" aria-modal="true" aria-labelledby="cart-title">
        <button class="modal__close" type="button" data-cart-close aria-label="Fechar carrinho">×</button>
        <h2 id="cart-title">Seu pedido</h2>
        <div id="cart-list"></div>
        <div class="modal__block" id="cart-pay"></div>
        <div class="modal__block" id="cart-address" hidden></div>
        <div class="modal__block" id="cart-delivery" hidden></div>
        <p class="modal__price" id="cart-total"></p>
        <p class="modal__hint" id="cart-hint"></p>
        <div class="modal__wa" id="cart-actions"></div>
      </div>
    </div>

    <p class="toast" id="toast" hidden>Adicionado ao carrinho</p>

    <script src="app.js?v=0.8.2-delivery"></script>
  </body>
</html>
